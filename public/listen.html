<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Listen to every Survivor High Tide episode from the full RSS-powered archive."
    />
    <title>Listen | Survivor High Tide</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Survivor High Tide home">
        <img src="/assets/logo-placeholder.svg" alt="" />
        <span>Survivor High Tide</span>
      </a>
      <div class="header-links">
        <nav aria-label="Main navigation">
          <a class="active" href="/listen">Listen</a>
          <a href="/shop">Shop</a>
          <a href="/about">About</a>
        </nav>
        <div class="social-nav" aria-label="Social links">
          <a href="https://www.instagram.com/survivorhightide/" target="_blank" rel="noreferrer" aria-label="Survivor High Tide on Instagram">
            <img src="/assets/instagram.svg" alt="" />
          </a>
          <a href="https://www.tiktok.com/@survivorhightide" target="_blank" rel="noreferrer" aria-label="Survivor High Tide on TikTok">
            <img src="/assets/tiktok.svg" alt="" />
          </a>
          <a href="mailto:survivorhightide@gmail.com" aria-label="Email Survivor High Tide">
            <img src="/assets/mail.svg" alt="" />
          </a>
        </div>
      </div>
    </header>

    <main>
      <section class="page-hero listen-hero" aria-labelledby="listen-title">
        <p class="section-label">Episode Repository</p>
        <h1 id="listen-title">Listen to the full tide.</h1>
        <p>
          Every published episode is pulled from the Survivor High Tide RSS feed and collected here
          with playable audio when the feed provides it.
        </p>
      </section>

      <section id="episodes" class="episodes-section standalone" aria-labelledby="episodes-title">
        <div class="section-heading">
          <p class="section-label">All Episodes</p>
          <h2 id="episodes-title">The Archive</h2>
        </div>
        <div class="episode-tools" aria-label="Episode filters">
          <button class="filter-button active" type="button" data-filter="all">All</button>
          <button class="filter-button" type="button" data-filter="recap">Recaps</button>
          <button class="filter-button" type="button" data-filter="preview">Previews</button>
          <button class="filter-button" type="button" data-filter="bonus">Bonus</button>
        </div>
        <div id="episode-grid" class="episode-grid"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p>Survivor High Tide</p>
      <p><a href="mailto:survivorhightide@gmail.com">survivorhightide@gmail.com</a></p>
    </footer>

    <script type="module" src="/app.js"></script>
  </body>
</html>
